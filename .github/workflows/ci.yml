name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: PYTHONPATH=. pytest -q
      - run: DATABASE_URL=sqlite:////tmp/migration_factory_ci.db alembic upgrade head
      - run: DATABASE_URL=sqlite:////tmp/migration_factory_ci.db alembic current
      - run: PYTHONPATH=. python -c "from app.main import app; assert app.version == '0.7.0'"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker build -t migration-factory-api:ci ./backend
      - run: docker build -t migration-factory-web:ci ./frontend


  terraform-export:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - run: pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend python backend/scripts/generate_terraform_fixture.py
      - run: terraform -chdir=/tmp/migration-factory-terraform fmt -check
      - run: terraform -chdir=/tmp/migration-factory-terraform init -backend=false
      - run: terraform -chdir=/tmp/migration-factory-terraform validate


  ansible-validation:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt "ansible-core>=2.18,<2.20"
      - run: PYTHONPATH=backend python backend/scripts/generate_ansible_fixture.py
      - run: ansible-galaxy collection install -r /tmp/migration-factory-ansible/collections/requirements.yml
      - run: ansible-inventory -i /tmp/migration-factory-ansible/inventory/hosts.yml --list >/tmp/ansible-inventory.json
      - run: ansible-playbook -i /tmp/migration-factory-ansible/inventory/hosts.yml /tmp/migration-factory-ansible/site.yml --syntax-check
      - run: ansible-playbook -i /tmp/migration-factory-ansible/inventory/hosts.yml /tmp/migration-factory-ansible/playbooks/validate_prism.yml --syntax-check
      - run: ansible-playbook -i /tmp/migration-factory-ansible/inventory/hosts.yml /tmp/migration-factory-ansible/playbooks/validate_linux.yml --syntax-check
      - run: ansible-playbook -i /tmp/migration-factory-ansible/inventory/hosts.yml /tmp/migration-factory-ansible/playbooks/validate_windows.yml --syntax-check
