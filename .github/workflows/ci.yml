name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: PYTHONPATH=. pytest -q
      - run: DATABASE_URL=sqlite:////tmp/migration_factory_ci.db alembic upgrade head
      - run: DATABASE_URL=sqlite:////tmp/migration_factory_ci.db alembic current
      - run: PYTHONPATH=. python -c "from app.main import app; assert app.version == '0.5.0'"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker build -t migration-factory-api:ci ./backend
      - run: docker build -t migration-factory-web:ci ./frontend
